<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 光柵對位模擬器 (Standalone)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX compiling -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            background-color: #020617;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Custom scrollbar styling for premium look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body>

    <!-- Target mount point for React App -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom High-Quality SVG Icons to avoid external Lucide dependencies
        const PlayIcon = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
        );

        const RotateCcwIcon = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <polyline points="3 3 3 8 8 8"></polyline>
            </svg>
        );

        const ActivityIcon = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        );

        const ShieldCheckIcon = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                <polyline points="9 11 11 13 15 9"></polyline>
            </svg>
        );

        const RadarIcon = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
                <path d="M12 17c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5z"></path>
                <path d="M12 12m-1 0a1 1 0 1 0 2 0 a1 1 0 1 0 -2 0"></path>
                <path d="M12 2v10l4 4"></path>
            </svg>
        );

        const LineChartIcon = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
            </svg>
        );

        const WaypointsIcon = ({ size = 16, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="3"></circle>
                <circle cx="19" cy="5" r="3"></circle>
                <circle cx="5" cy="19" r="3"></circle>
                <circle cx="19" cy="19" r="3"></circle>
                <circle cx="5" cy="5" r="3"></circle>
                <line x1="16.5" y1="7.5" x2="14" y2="10"></line>
                <line x1="7.5" y1="16.5" x2="10" y2="14"></line>
                <line x1="16.5" y1="16.5" x2="14" y2="14"></line>
                <line x1="7.5" y1="7.5" x2="10" y2="10"></line>
            </svg>
        );

        // ==========================================
        // Global Constants & Coupling Logic
        // ==========================================
        const MAX_STEPS = 120;
        const START = { x: 50, y: 350 };
        const PEAK = { x: 420, y: 80 }; 
        const FAKE_PEAK = { x: 260, y: 237.5 }; 

        const calculateEfficiency = (x, y, withNoise = false) => {
            const dx = x - PEAK.x;
            const dy = y - PEAK.y;
            const distSq = dx * dx + dy * dy;
            const envelope = Math.exp(-(distSq / 20000)); 
            const ripple = Math.max(1 + 0.25 * Math.cos(dx / 20) * Math.cos(dy / 20), 0) / 1.25;
            let baseEff = envelope * ripple * 100;

            if (withNoise) {
                const noiseVariance = baseEff > 15 ? (Math.random() * 25 - 12.5) : (Math.random() * 4 - 2);
                baseEff += noiseVariance;
            }
            return Math.max(0, Math.min(100, baseEff));
        };

        const Scene3D = ({ path, currentStep, isBO, hasNoise, isRunning }) => {
            const mountRef = useRef(null);
            const sceneObjects = useRef({});

            useEffect(() => {
                if (!window.THREE || !mountRef.current) return;
                const THREE = window.THREE;

                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(45, mountRef.current.clientWidth / mountRef.current.clientHeight, 0.1, 2000);
                camera.position.set(-180, 220, 280); 
                camera.lookAt(50, -20, -50); 

                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                renderer.setPixelRatio(window.devicePixelRatio);
                mountRef.current.appendChild(renderer.domElement);

                const mainGroup = new THREE.Group();
                scene.add(mainGroup);
                sceneObjects.current.mainGroup = mainGroup;

                // Build 3D mesh surface terrain
                const geo = new THREE.PlaneGeometry(500, 400, 60, 50);
                geo.rotateX(-Math.PI / 2); 
                
                const pos = geo.attributes.position;
                const colors = [];
                const color = new THREE.Color();
                
                for(let i = 0; i < pos.count; i++) {
                    const realX = pos.getX(i) + 250; 
                    const realY = pos.getZ(i) + 200; 
                    const eff = calculateEfficiency(realX, realY, false); 
                    pos.setY(i, eff * 1.2); 

                    const hue = 0.66 - (eff / 100) * 0.66;
                    color.setHSL(hue, 1.0, 0.5);
                    colors.push(color.r, color.g, color.b);
                }
                geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geo.computeVertexNormals();

                const mat = new THREE.MeshBasicMaterial({ vertexColors: true, wireframe: true, transparent: true, opacity: 0.6 });
                const surface = new THREE.Mesh(geo, mat);
                mainGroup.add(surface);

                // Peak peak marker (Red point)
                const targetMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const targetMesh = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 16), targetMat);
                const targetZ = calculateEfficiency(PEAK.x, PEAK.y, false) * 1.2;
                targetMesh.position.set(PEAK.x - 250, targetZ, PEAK.y - 200);
                mainGroup.add(targetMesh);

                // Local trap area marker (Fake peak cylinder)
                if (!isBO && hasNoise) {
                    const trapMat = new THREE.MeshBasicMaterial({ color: 0xf43f5e, wireframe: true, transparent: true, opacity: 0.4 });
                    const trapMesh = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 60, 16), trapMat);
                    const trapZ = calculateEfficiency(FAKE_PEAK.x, FAKE_PEAK.y, false) * 1.2;
                    trapMesh.position.set(FAKE_PEAK.x - 250, trapZ/2, FAKE_PEAK.y - 200);
                    mainGroup.add(trapMesh);
                }

                // Trajectory path line
                const lineGeo = new THREE.BufferGeometry();
                const linePositions = new Float32Array(MAX_STEPS * 3);
                lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
                const lineMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
                const pathLine = new THREE.Line(lineGeo, lineMat);
                mainGroup.add(pathLine);
                sceneObjects.current.pathLine = pathLine;

                // Tracker probe sphere
                const probeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const probeMesh = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16), probeMat);
                mainGroup.add(probeMesh);
                sceneObjects.current.probeMesh = probeMesh;

                // Bayesian Optimization elements
                if (isBO) {
                    const anchorGroup = new THREE.Group();
                    sceneObjects.current.anchors = [];
                    for(let i=0; i<8; i++) {
                        const m = new THREE.Mesh(new THREE.BoxGeometry(6,6,6), new THREE.MeshBasicMaterial({color: 0x22d3ee}));
                        m.visible = false;
                        anchorGroup.add(m);
                        sceneObjects.current.anchors.push(m);
                    }
                    mainGroup.add(anchorGroup);

                    const radarMesh = new THREE.Mesh(
                        new THREE.RingGeometry(15, 40, 32),
                        new THREE.MeshBasicMaterial({ color: 0x22d3ee, side: THREE.DoubleSide, transparent: true, opacity: 0.4 })
                    );
                    radarMesh.rotation.x = -Math.PI / 2;
                    radarMesh.position.set(PEAK.x - 250, targetZ + 5, PEAK.y - 200);
                    radarMesh.visible = false;
                    mainGroup.add(radarMesh);
                    sceneObjects.current.radarMesh = radarMesh;
                }

                // Drag/Camera Angle Mouse control
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };

                const handleMouseDown = (e) => { isDragging = true; };
                const handleMouseMove = (e) => {
                    const deltaMove = {
                        x: e.offsetX - previousMousePosition.x,
                        y: e.offsetY - previousMousePosition.y
                    };

                    if (isDragging) {
                        mainGroup.rotation.y += deltaMove.x * 0.005;
                        mainGroup.rotation.x += deltaMove.y * 0.005;
                    }

                    previousMousePosition = {
                        x: e.offsetX,
                        y: e.offsetY
                    };
                };
                const handleMouseUp = () => { isDragging = false; };

                // Touch support
                const handleTouchStart = (e) => {
                    if (e.touches.length === 1) {
                        isDragging = true;
                        const rect = mountRef.current.getBoundingClientRect();
                        previousMousePosition = {
                            x: e.touches[0].clientX - rect.left,
                            y: e.touches[0].clientY - rect.top
                        };
                    }
                };

                const handleTouchMove = (e) => {
                    if (isDragging && e.touches.length === 1) {
                        const rect = mountRef.current.getBoundingClientRect();
                        const currentX = e.touches[0].clientX - rect.left;
                        const currentY = e.touches[0].clientY - rect.top;
                        const deltaMove = {
                            x: currentX - previousMousePosition.x,
                            y: currentY - previousMousePosition.y
                        };

                        mainGroup.rotation.y += deltaMove.x * 0.007;
                        mainGroup.rotation.x += deltaMove.y * 0.007;

                        previousMousePosition = { x: currentX, y: currentY };
                    }
                };

                const container = mountRef.current;
                container.addEventListener('mousedown', handleMouseDown);
                container.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
                container.addEventListener('touchstart', handleTouchStart, { passive: true });
                container.addEventListener('touchmove', handleTouchMove, { passive: true });
                container.addEventListener('touchend', handleMouseUp);

                // Handle Responsive resize
                const handleResize = () => {
                    if (!mountRef.current) return;
                    camera.aspect = mountRef.current.clientWidth / mountRef.current.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                };
                window.addEventListener('resize', handleResize);

                let reqId;
                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    cancelAnimationFrame(reqId);
                    renderer.dispose();
                    if (container) {
                        container.removeEventListener('mousedown', handleMouseDown);
                        container.removeEventListener('mousemove', handleMouseMove);
                        container.removeEventListener('touchstart', handleTouchStart);
                        container.removeEventListener('touchmove', handleTouchMove);
                        container.removeEventListener('touchend', handleMouseUp);
                        if (container.contains(renderer.domElement)) {
                            container.removeChild(renderer.domElement);
                        }
                    }
                    window.removeEventListener('mouseup', handleMouseUp);
                    window.removeEventListener('resize', handleResize);
                };
            }, [isBO, hasNoise]);

            useEffect(() => {
                if (!sceneObjects.current.pathLine || path.length === 0) return;
                
                const current = path[currentStep] || path[0];
                const positions = sceneObjects.current.pathLine.geometry.attributes.position.array;
                let validCount = 0;

                for(let i = 0; i <= currentStep; i++) {
                    const p = path[i];
                    if (p && (!isBO || p.isArc)) { 
                        const x3d = p.x - 250;
                        const z3d = p.y - 200;
                        const h = calculateEfficiency(p.x, p.y, false) * 1.2; 
                        positions[validCount*3] = x3d;
                        positions[validCount*3+1] = h + 2; 
                        positions[validCount*3+2] = z3d;
                        validCount++;
                    }
                }
                sceneObjects.current.pathLine.geometry.setDrawRange(0, validCount);
                sceneObjects.current.pathLine.geometry.attributes.position.needsUpdate = true;

                const curX = current.x - 250;
                const curZ = current.y - 200;
                const curH = calculateEfficiency(current.x, current.y, false) * 1.2;
                
                const isJittering = hasNoise && isRunning && currentStep < MAX_STEPS;
                const jitterX = isJittering ? (Math.random()*4-2) : 0;
                const jitterZ = isJittering ? (Math.random()*4-2) : 0;

                sceneObjects.current.probeMesh.position.set(curX + jitterX, curH + 4, curZ + jitterZ);

                if (isBO) {
                    const anchors = [
                        {x: 80, y: 280}, {x: 320, y: 300}, {x: 200, y: 150}, {x: 120, y: 80},
                        {x: 380, y: 220}, {x: 280, y: 60}, {x: 160, y: 220}, {x: 360, y: 160}
                    ];
                    for(let i = 0; i < 8; i++) {
                        const mesh = sceneObjects.current.anchors[i];
                        if (i < current.activeAnchors) {
                            mesh.visible = true;
                            mesh.position.set(anchors[i].x - 250, calculateEfficiency(anchors[i].x, anchors[i].y)*1.2 + 5, anchors[i].y - 200);
                        } else {
                            mesh.visible = false;
                        }
                    }
                    if (sceneObjects.current.radarMesh) {
                        sceneObjects.current.radarMesh.visible = current.showRadar;
                        if (current.showRadar) sceneObjects.current.radarMesh.rotation.z += 0.05; 
                    }
                }

            }, [currentStep, path, isBO, hasNoise, isRunning]);

            return (
                <div className="relative w-full aspect-[4/3] bg-slate-950 rounded-xl overflow-hidden border border-slate-700 shadow-[inset_0_0_50px_rgba(0,0,0,0.8)] cursor-grab active:cursor-grabbing">
                    <div ref={mountRef} className="absolute inset-0 z-0" />
                    <div className="absolute top-3 right-3 bg-slate-900/85 px-3 py-2 rounded-lg border border-slate-700 text-[11px] text-slate-300 z-10 backdrop-blur-sm pointer-events-none select-none">
                        <div className="flex items-center justify-end gap-2 mb-1">
                            <div className="w-2.5 h-2.5 rounded-full bg-red-600"></div> <span className="text-red-400 font-bold">最佳耦光頂點</span>
                        </div>
                        {isBO ? (
                            <>
                                <div className="flex items-center justify-end gap-2 mb-1">
                                    <div className="w-2.5 h-2.5 bg-cyan-400"></div> <span className="text-slate-400">感測錨點</span>
                                </div>
                                <div className="flex items-center justify-end gap-2 text-slate-400">
                                    <div className="w-4 h-4 border-2 border-dashed border-cyan-400 rounded-full"></div> <span>機率預測圖</span>
                                </div>
                            </>
                        ) : (
                            <>
                                <div className="flex items-center justify-end gap-2 text-slate-400 mb-1">
                                    <div className="w-4 h-1 bg-white"></div> <span>光柵掃描路徑</span>
                                </div>
                                {hasNoise && currentStep >= 40 && (
                                    <div className="flex items-center justify-end gap-2 text-rose-400 font-bold">
                                        <div className="w-2.5 h-4 border-2 border-rose-500 rounded-sm animate-pulse"></div> <span>局部誤區</span>
                                    </div>
                                )}
                            </>
                        )}
                        <div className="mt-2 text-[9px] text-slate-500 text-right">按住左鍵並拖曳可旋轉視角</div>
                    </div>
                </div>
            );
        };

        function App() {
            const [isRunning, setIsRunning] = useState(false);
            const [hasNoise, setHasNoise] = useState(false);
            const [step, setStep] = useState(0);

            const [tradStats, setTradStats] = useState({ efficiency: 0, phase: '等待開始', d5: [0,0,0,0,0] });
            const [boStats, setBoStats] = useState({ efficiency: 0, phase: '等待開始', d5: [0,0,0,0,0] });

            const [tradPath, setTradPath] = useState([]);
            const [boPath, setBoPath] = useState([]);

            // Generate trajectories
            useEffect(() => {
                let tPath = [];
                let bPath = [];
                
                const anchors = [
                    {x: 80, y: 280}, {x: 320, y: 300}, {x: 200, y: 150}, {x: 120, y: 80},
                    {x: 380, y: 220}, {x: 280, y: 60}, {x: 160, y: 220}, {x: 360, y: 160}
                ];
                const lerp = (start, end, t) => start + (end - start) * t;

                // Traditional Raster Search Generator (Fails with local traps when noise is on)
                const TOTAL_ROWS = 14; 
                const STEPS_PER_ROW = 8;
                let foundPeak = false;
                let hitFakePeak = false;

                for (let i = 0; i <= MAX_STEPS; i++) {
                    let current = { d5: [0,0,0,0,0] };
                    
                    if (hitFakePeak) {
                        current.x = FAKE_PEAK.x + (Math.random() * 24 - 12); 
                        current.y = FAKE_PEAK.y + (Math.random() * 24 - 12);
                        current.phase = '雜訊誤判：提早結束掃描，陷入局部誤區';
                        current.d5 = [52, 40, 15 + Math.random()*20, 15 + Math.random()*5, 15 + Math.random()*5]; 
                    } 
                    else if (!foundPeak) {
                        const row = Math.min(TOTAL_ROWS - 1, Math.floor(i / STEPS_PER_ROW)); 
                        const progressInRow = (i % STEPS_PER_ROW) / (STEPS_PER_ROW - 1);
                        current.y = START.y - row * ((START.y - PEAK.y) / (TOTAL_ROWS - 1));
                        current.x = (row % 2 === 0) ? lerp(START.x, 480, progressInRow) : lerp(480, START.x, progressInRow);
                        
                        current.phase = `光柵掃描中 (Y=${current.y.toFixed(0)})`;
                        current.d5 = [(current.x/500)*100, ((400-current.y)/400)*100, 15, 15, 15];

                        if (hasNoise && Math.abs(current.x - FAKE_PEAK.x) < 30 && Math.abs(current.y - FAKE_PEAK.y) < 20) {
                             hitFakePeak = true; 
                        }
                        else if (row >= TOTAL_ROWS - 2 && Math.abs(current.x - PEAK.x) < 20) {
                             foundPeak = true;
                        }
                    } 
                    else {
                        current.x = PEAK.x; current.y = PEAK.y;
                        current.phase = 'XY 已鎖定，等待 Z/角度 序列微調';
                        const tuningProgress = (i - (TOTAL_ROWS * STEPS_PER_ROW - 10)) / 25;
                        const zVal = Math.min(98, 15 + Math.max(0, tuningProgress) * 150);
                        current.d5 = [95, 95, zVal, zVal > 30 ? zVal - 15 : 15, zVal > 30 ? zVal - 15 : 15];
                    }
                    tPath.push(current);
                }

                // Bayesian Optimization Generator
                for (let i = 0; i <= MAX_STEPS; i++) {
                    if (i < 15) {
                        const anchorCount = Math.min(8, Math.floor(i / 2));
                        bPath.push({ activeAnchors: anchorCount, phase: '佈建感測錨點 (Data Sampling)', x: START.x, y: START.y, d5: [15,15,15,15,15], showRadar: false });
                    } else if (i < 30) {
                        bPath.push({ activeAnchors: 8, phase: '建構高斯機率預測圖 (Surrogate Model)', x: START.x, y: START.y, d5: [15,15,15,15,15], showRadar: true });
                    } else if (i < 65) {
                        const p = (i - 30) / 35; 
                        const easeP = 1 - Math.pow(1 - p, 3); 
                        
                        const controlPoint = { x: 150, y: 100 }; 
                        const bx = Math.pow(1-easeP, 2)*START.x + 2*(1-easeP)*easeP*controlPoint.x + Math.pow(easeP, 2)*PEAK.x;
                        const by = Math.pow(1-easeP, 2)*START.y + 2*(1-easeP)*easeP*controlPoint.y + Math.pow(easeP, 2)*PEAK.y;

                        const jitter = hasNoise ? (1 - easeP) * (Math.random() * 20 - 10) : 0; 
                        bPath.push({
                            activeAnchors: 8, x: bx + jitter, y: by + jitter,
                            d5: [lerp(15, 95, easeP), lerp(15, 95, easeP), lerp(15, 95, easeP), lerp(15, 95, easeP), lerp(15, 95, easeP)],
                            phase: '5維度聯合收斂：直飛高機率目標區', showRadar: true, isArc: true
                        });
                    } else {
                        bPath.push({
                            activeAnchors: 0, showRadar: false, isArc: true,
                            x: PEAK.x + (hasNoise ? Math.random()*6-3 : Math.random()*2-1), 
                            y: PEAK.y + (hasNoise ? Math.random()*6-3 : Math.random()*2-1),
                            d5: [96+Math.random()*4, 96+Math.random()*4, 96+Math.random()*4, 96+Math.random()*4, 96+Math.random()*4],
                            phase: '克服干擾，穩健鎖定核心 (>90%)'
                        });
                    }
                }

                setTradPath(tPath);
                setBoPath(bPath);
                setStep(0);
            }, [hasNoise]);

            // Animation Loop Clock
            useEffect(() => {
                let interval;
                if (isRunning) {
                    interval = setInterval(() => {
                        setStep((prev) => {
                            const next = prev + 1;
                            if (next >= MAX_STEPS) { setIsRunning(false); return MAX_STEPS; }
                            const curTrad = tradPath[next], curBo = boPath[next];
                            if (curTrad && curBo) {
                                let tEff = calculateEfficiency(curTrad.x, curTrad.y, hasNoise && !curTrad.phase.includes('誤區'));
                                if (hasNoise && curTrad.phase.includes('誤區')) tEff = 35 + (curTrad.d5[2]*0.15); 
                                const bEff = calculateEfficiency(curBo.x, curBo.y, hasNoise);
                                setTradStats({ efficiency: Math.max(0, tEff), phase: curTrad.phase, d5: curTrad.d5 });
                                setBoStats({ efficiency: Math.max(0, bEff), phase: curBo.phase, d5: curBo.d5 });
                            }
                            return next;
                        });
                    }, 50);
                }
                return () => clearInterval(interval);
            }, [isRunning, tradPath, boPath, hasNoise]);

            const reset = () => {
                setIsRunning(false);
                setStep(0);
                setTradStats({ efficiency: 0, phase: '等待開始', d5: [0,0,0,0,0] });
                setBoStats({ efficiency: 0, phase: '等待開始', d5: [0,0,0,0,0] });
            };

            const render5DDashboard = (d5Values, isBO) => {
                const labels = ['X', 'Y', 'Z', 'θ (俯仰)', 'φ (偏航)'];
                const colors = isBO ? 'bg-cyan-400 shadow-[0_0_8px_rgba(34,211,238,0.7)]' : 'bg-blue-400';
                return (
                    <div className="grid grid-cols-5 gap-2 mt-4 pt-3 border-t border-slate-800/50">
                        {d5Values.map((val, idx) => (
                            <div key={idx} className="flex flex-col items-center gap-1">
                                <div className="h-12 w-3 bg-slate-800 rounded-full overflow-hidden relative border border-slate-700">
                                    <div className={`absolute bottom-0 w-full ${colors} transition-all duration-75`} style={{ height: `${Math.min(100, Math.max(0, val))}%` }}></div>
                                </div>
                                <span className="text-[10px] text-slate-400 scale-90 whitespace-nowrap">{labels[idx]}</span>
                            </div>
                        ))}
                        <div className="col-span-5 text-center mt-1">
                            <span className={`text-[11px] font-semibold ${isBO ? 'text-cyan-500' : 'text-blue-500'}`}>
                                {isBO ? '5維度：同步智能聯動' : '5維度：被迫序列等待'}
                            </span>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen text-slate-200 p-4 md:p-6 font-sans selection:bg-cyan-900">
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* Header Controls */}
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-slate-800 pb-5 gap-4">
                            <div>
                                <h1 className="text-2xl md:text-3xl font-bold bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent flex items-center gap-3">
                                    <RadarIcon size={28} className="text-cyan-400 animate-pulse" />
                                    3D 立體地貌對位：瞎子摸象 vs. 上帝視角 (AI預測)
                                </h1>
                                <p className="text-slate-400 mt-2 max-w-3xl text-sm leading-relaxed">
                                    **用真實的 3D 高度體驗演算法之美**：高低起伏的網格代表了不同空間位置的「耦光效率」。<br/>
                                    傳統設備只能沿著山壁盲目攀爬；Veltrion BO 則透過發射錨點偵測全貌，並化身精準導彈，跨越山谷直飛 100% 效率主峰！
                                </p>
                            </div>

                            <div className="flex flex-wrap bg-slate-900/90 p-1.5 rounded-xl border border-slate-800 shadow-inner gap-2 shrink-0">
                                <button onClick={() => setIsRunning(true)} disabled={isRunning || step >= MAX_STEPS} className="flex items-center gap-2 px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 disabled:bg-slate-800 disabled:text-slate-500 text-white rounded-lg text-sm font-medium transition-all shadow-[0_0_15px_rgba(8,145,178,0.5)] disabled:shadow-none">
                                    <PlayIcon size={16} /> 執行模擬對比
                                </button>
                                <button onClick={reset} className="flex items-center gap-2 px-3 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-medium transition-all">
                                    <RotateCcwIcon size={16} /> 重置
                                </button>
                                <div className="w-px bg-slate-700 mx-1 my-1"></div>
                                <button onClick={() => { reset(); setHasNoise(!hasNoise); }} className={`flex items-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium transition-all ${hasNoise ? 'bg-rose-500/20 text-rose-400 border border-rose-500/50' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-transparent'}`}>
                                    <ActivityIcon size={16} />
                                    {hasNoise ? '60Hz 震動干擾 (已開啟)' : '無雜訊理想環境'}
                                </button>
                            </div>
                        </div>

                        {}
                        <div className="grid lg:grid-cols-2 gap-6">
                            
                            {/* Traditional Raster Method */}
                            <div className="space-y-4">
                                <div className="bg-slate-900/40 p-5 rounded-xl border border-slate-800 flex flex-col h-full">
                                    <div className="flex items-start gap-3 mb-4">
                                        <div className="p-2 bg-blue-500/20 rounded-lg"><LineChartIcon size={20} className="text-blue-400" /></div>
                                        <div>
                                            <h2 className="text-lg font-bold text-blue-400">傳統：光柵掃描 (瞎子摸象)</h2>
                                            <p className="text-xs text-slate-400 mt-1">走一步算一步，在平原耗費大量時間。</p>
                                        </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3 mb-4">
                                        <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 relative overflow-hidden">
                                            <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1">即時耦合效率</div>
                                            <div className={`text-3xl font-bold ${tradStats.efficiency > 90 ? 'text-green-400' : (hasNoise && step > 40 ? 'text-rose-400' : 'text-slate-200')}`}>
                                                {tradStats.efficiency.toFixed(1)}%
                                            </div>
                                        </div>
                                        <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 flex flex-col justify-center">
                                            <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1">演算法動作相位</div>
                                            <div className={`text-[12px] font-bold mt-1 leading-tight ${tradStats.phase.includes('誤區') ? 'text-rose-400' : 'text-blue-300'}`}>
                                                {tradStats.phase}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <Scene3D path={tradPath} currentStep={step} isBO={false} hasNoise={hasNoise} isRunning={isRunning} />
                                    {render5DDashboard(tradStats.d5, false)}
                                </div>
                            </div>

                            {/* Bayesian Optimization Method */}
                            <div className="space-y-4">
                                <div className="bg-slate-900/40 p-5 rounded-xl border border-slate-800 relative overflow-hidden flex flex-col h-full">
                                    <div className="absolute top-0 right-0 w-40 h-40 bg-cyan-500/10 blur-[50px] rounded-full mix-blend-screen pointer-events-none"></div>
                                    
                                    <div className="flex items-start gap-3 mb-4 relative z-10">
                                        <div className="p-2 bg-cyan-500/20 rounded-lg"><WaypointsIcon size={20} className="text-cyan-400" /></div>
                                        <div>
                                            <h2 className="text-lg font-bold text-cyan-400">Veltrion：預測地圖 + 精準打擊</h2>
                                            <p className="text-xs text-slate-400 mt-1">錨點感測全貌，無視假山峰直飛頂點。</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 mb-4 relative z-10">
                                        <div className="bg-slate-900 p-3 rounded-lg border border-slate-800">
                                            <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1">即時耦合效率</div>
                                            <div className={`text-3xl font-bold ${boStats.efficiency > 90 ? 'text-cyan-400' : 'text-slate-200'}`}>
                                                {boStats.efficiency.toFixed(1)}%
                                            </div>
                                        </div>
                                        <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 flex flex-col justify-center">
                                            <div className="text-[10px] text-slate-500 uppercase tracking-wider mb-1">演算法動作相位</div>
                                            <div className={`text-[12px] font-bold mt-1 leading-tight ${boStats.phase.includes('鎖定') ? 'text-green-400' : 'text-cyan-300'}`}>
                                                {boStats.phase}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <Scene3D path={boPath} currentStep={step} isBO={true} hasNoise={hasNoise} isRunning={isRunning} />
                                    {render5DDashboard(boStats.d5, true)}
                                </div>
                            </div>

                        </div>

                        {/* Technical Summary section */}
                        <div className="bg-slate-900/80 rounded-xl border border-slate-800 p-5 mt-4 flex items-start gap-4">
                            <ShieldCheckIcon size={32} className="text-rose-400 shrink-0 mt-1" />
                            <div>
                                <h3 className="text-sm font-bold text-slate-200 mb-2">致命缺陷視覺化：為什麼傳統方法會「發散失敗」？</h3>
                                <div className="grid md:grid-cols-2 gap-4 text-xs text-slate-400 leading-relaxed">
                                    <div>
                                        <strong className="text-rose-300">雜訊造成的提早誤判 (Bimodal Failure)</strong><br/>
                                        打開「60Hz 震動干擾」並執行。您會看見傳統的光柵掃描在爬坡時，撞到了一個機台震動產生的「雜訊突波」。系統誤以為找到了最高點，<strong className="text-rose-400">直接終止了後續的全區掃描</strong>！接著，它開始在那個錯誤的地點瞎調 Z 軸與角度（探針開始在紅色的「局部誤區」中無效打轉發散），這就是論文所指的嚴重產線災難。
                                    </div>
                                    <div>
                                        <strong className="text-cyan-300">為什麼 Veltrion BO 是 95%~99% 而不是 100%？</strong><br/>
                                        在無雜訊時，BO 能完美鎖定 100%。但在真實產線 (60Hz 干擾) 下，機台隨時在微震。傳統的 100% 只是「靜態假象」，一旦震動就斷線；Veltrion 的 BO 演算法則是建構高斯預測模型，主動將雜訊平滑化。畫面中 95%~99% 的微幅跳動，正是因為它<strong className="text-cyan-400">「精準站在震動中心，持續輸出最穩定的高良率」</strong>！
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // Initialize App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
